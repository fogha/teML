<h1>DeepSeek</h1>
<p><span class="text-muted">A quiet terminal conversation · streaming responses</span></p>
<div data-teml="grid" data-columns="1" data-id="history">
  <div class="card">
    <p><span class="text-muted">Ask a question to begin. Your messages appear here.</span></p>
  </div>
</div>
<div data-teml="grid" data-columns="1" data-id="status">
  <div class="alert alert-info">Ready.</div>
</div>
<form id="composer" aria-label="Conversation">
  <label for="message">Message</label>
  <textarea
    id="message"
    rows="2"
    width="64"
    padding="1"
    margin="1"
    data-auto-grow
    data-max-rows="6"
    required
    placeholder="Ask something useful…"
  ></textarea>
  <div data-teml="row" data-gap="2">
    <button id="send" type="submit">Send</button>
    <button id="new" type="button" data-variant="secondary">New chat</button>
  </div>
</form>
<p>
  <span class="text-muted"
    >Ctrl+Enter sends · Tab changes focus · New chat cancels the response · Ctrl+C exits</span
  >
</p>
