[package]
name = "teml-host"
version = "0.1.0"
edition = "2021"
description = "Rust host library for the TeML interactive NDJSON protocol (`teml run`)"
readme = "README.md"
license = "MIT"
repository = "https://github.com/fogha/teML"
keywords = ["terminal", "teml", "tui", "ndjson"]
categories = ["command-line-utilities"]
# Integration tests need a sibling monorepo view and a built engine, so they
# cannot pass from a published crate; keep them out of the artifact.
include = ["src/**/*", "README.md", "LICENSE"]

[features]
default = ["terminal"]
terminal = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.28", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
