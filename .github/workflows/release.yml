name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache-dependency-path: hosts/go/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hosts/python/pyproject.toml

      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e "./hosts/python[dev]"
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm test
      - run: cargo fmt --manifest-path crates/teml-host/Cargo.toml -- --check
      - run: cargo fmt --manifest-path examples/rust-host/Cargo.toml -- --check
      - run: cargo clippy --locked --all-features --manifest-path crates/teml-host/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path examples/rust-host/Cargo.toml --all-targets -- -D warnings
      - run: cargo package --locked --manifest-path crates/teml-host/Cargo.toml
      - run: test -z "$(gofmt -l .)"
        working-directory: hosts/go
      - run: go vet ./...
        working-directory: hosts/go
      - run: python -m compileall -q src tests examples
        working-directory: hosts/python
      - run: python -m pip wheel --no-deps ./hosts/python --wheel-dir /tmp/teml-python-dist
      - run: pnpm run test:perf
        env:
          TEML_LAYOUT_PERF_BUDGET_MS: "200"
          TEML_PARSE_PERF_BUDGET_MS: "200"
      - run: pnpm run pack:verify
      - run: node scripts/release-pack.mjs
      - run: pnpm run host:engine:prepare
      - run: pnpm run test:hosts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "teml.tgz#TeML install package"
          --verify-tag
          --generate-notes
          --title "TeML ${GITHUB_REF_NAME#v}"

  # Each package carries its own version, independent of the tag, so a publish is
  # a no-op unless that version is new. Bump the version file to ship.
  publish-npm:
    name: Publish teml to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          if npm view "teml@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "teml@${{ steps.version.outputs.value }} is already on npm; skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.already == 'false'
        run: pnpm install --frozen-lockfile

      # `prepublishOnly` rebuilds, runs the Node suites, and re-runs pack:verify.
      - if: steps.check.outputs.already == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crate:
    name: Publish teml-host to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - id: version
        run: |
          value=$(awk -F'"' '/^version *=/{print $2; exit}' crates/teml-host/Cargo.toml)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: teml-release' \
            "https://crates.io/api/v1/crates/teml-host/${{ steps.version.outputs.value }}")
          if [ "$code" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "teml-host ${{ steps.version.outputs.value }} is already on crates.io; skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.already == 'false'
        run: cargo publish --locked --manifest-path crates/teml-host/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: Publish teml-host to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: version
        run: |
          value=$(awk -F'"' '/^version *=/{print $2; exit}' hosts/python/pyproject.toml)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/teml-host/${{ steps.version.outputs.value }}/json")
          if [ "$code" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "teml-host ${{ steps.version.outputs.value }} is already on PyPI; skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.already == 'false'
        run: python -m pip install --upgrade build

      - if: steps.check.outputs.already == 'false'
        run: python -m build --outdir dist-python hosts/python

      - if: steps.check.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python
          password: ${{ secrets.PYPI_API_TOKEN }}
