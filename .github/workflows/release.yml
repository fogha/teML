name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:perf
        env:
          TEML_PARSE_PERF_BUDGET_MS: "200"
      - run: npm run pack:verify
      - run: npm run release:pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "teml.tgz#TeML install package"
          --verify-tag
          --generate-notes
          --title "TeML ${GITHUB_REF_NAME#v}"
