name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run test:invariants
        env:
          # Shared runners are noisy; the >7s regression this guards still fails.
          TEML_NESTING_PARSE_BUDGET_MS: "5000"
      - run: pnpm run test:system

  performance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:perf
        env:
          # GitHub-hosted runners are shared and slower than the <100ms local
          # target. This still catches large regressions without flaky CI.
          TEML_LAYOUT_PERF_BUDGET_MS: "200"
          TEML_PARSE_PERF_BUDGET_MS: "200"
          TEML_APPEND_PERF_BUDGET_MS: "100"

  rust-host:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: cargo fmt --manifest-path crates/teml-host/Cargo.toml -- --check
      - run: cargo fmt --manifest-path examples/rust-host/Cargo.toml -- --check
      - run: cargo clippy --locked --all-features --manifest-path crates/teml-host/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path examples/rust-host/Cargo.toml --all-targets -- -D warnings
      - run: pnpm run test:rust-host
        env:
          TEML_CLI: ${{ github.workspace }}/dist/cli/main.js
      - run: cargo package --locked --manifest-path crates/teml-host/Cargo.toml

  go-host:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache-dependency-path: hosts/go/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: gofmt -l . && test -z "$(gofmt -l .)"
        working-directory: hosts/go
      - run: go vet ./...
        working-directory: hosts/go
      - run: go test ./... -count=1
        working-directory: hosts/go
        env:
          TEML_CLI: ${{ github.workspace }}/dist/cli/main.js
      - run: go build ./examples/incident-handoff
        working-directory: hosts/go

  python-host:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hosts/python/pyproject.toml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: python -m pip install -e "./hosts/python[dev]"
      - run: python -m compileall -q src tests examples
        working-directory: hosts/python
      - run: python -m pytest -q
        working-directory: hosts/python
        env:
          TEML_CLI: ${{ github.workspace }}/dist/cli/main.js
      - run: python -m pip wheel --no-deps ./hosts/python --wheel-dir /tmp/teml-python-dist

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack:verify
