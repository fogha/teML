<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="title" content="Meta Title Override">
  <title>Elements Fixture</title>
</head>
<body>
  <h1>Heading One</h1>
  <h2>Heading Two</h2>
  <h5>Deep Heading</h5>
  <p>Paragraph with <strong>bold</strong>, <em>italic</em>, <u>underline</u>, and <code>inline code</code>.</p>
  <p>Link to <a href="https://example.com/docs">documentation</a>.</p>
  <ul>
    <li>Alpha</li>
    <li>Beta</li>
  </ul>
  <ol start="3">
    <li>Gamma</li>
    <li>Delta</li>
  </ol>
  <blockquote><p>A quoted thought.</p></blockquote>
  <hr>
  <pre><code class="language-typescript">const answer = 42;</code></pre>
  <dl>
    <dt>Host</dt><dd>db-primary</dd>
    <dt>Port</dt><dd>5432</dd>
  </dl>
  <img src="https://example.com/chart.png" alt="Latency chart">
  <table>
    <thead>
      <tr><th>Key</th><th>Value</th></tr>
    </thead>
    <tbody>
      <tr><td>Env</td><td>staging</td></tr>
    </tbody>
  </table>
</body>
</html>
