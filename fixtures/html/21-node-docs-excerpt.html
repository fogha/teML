<!doctype html>
<html>
<head><title>Node.js Docs Excerpt</title></head>
<body>
  <nav>Node.js v22 Documentation</nav>
  <article>
    <h1>fs.readFile(path[, options], callback)</h1>
    <p>Asynchronously reads the entire contents of a file.</p>
    <h2>Parameters</h2>
    <dl>
      <dt>path <span>string</span></dt>
      <dd>Filename or file descriptor</dd>
      <dt>options <span>Object</span></dt>
      <dd>Encoding and flag options</dd>
    </dl>
    <div class="alert alert-warning">The callback is called with an error if the file cannot be read.</div>
  </article>
</body>
</html>
