[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teml-host"
version = "0.1.0"
description = "Stdlib-only Python host library for the TeML interactive NDJSON protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fogha" }]
keywords = ["terminal", "teml", "tui", "ndjson"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Terminals",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/teml_host"]

[tool.hatch.build.targets.sdist]
include = ["src/teml_host", "examples", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["teml_host"]
